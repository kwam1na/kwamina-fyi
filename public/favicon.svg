<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ink {
      fill: #151821;
    }

    @media (prefers-color-scheme: dark) {
      .ink {
        fill: #f2f0eb;
      }
    }
  </style>
  <defs>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect class="ink" width="2" height="2" />
      <rect class="ink" x="2" y="2" width="2" height="2" />
    </pattern>
  </defs>
  <text
    x="32"
    y="51"
    fill="url(#dither)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
    font-weight="500"
    text-anchor="middle"
  >k</text>
</svg>
