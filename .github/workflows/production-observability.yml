name: Production observability

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CHAT_EVALUATION_TOKEN: ${{ secrets.CHAT_EVALUATION_TOKEN }}
      CANARY_HEARTBEAT_URL: ${{ secrets.CANARY_HEARTBEAT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.1.29
      - name: Run production canary
        run: bun run smoke:production
